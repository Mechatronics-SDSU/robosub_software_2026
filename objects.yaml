course: jesse_pool # course that the sub is running in
motor_factor: 0.7 # changes motor speed, ~0.1 for air, ~0.7 for water

jesse_pool: # ------------------------------------------------------------------------------------------------------
  # smaller coordinates for jesse's pool (~9.02m long, ~1.2m min depth, ~3m wide)
  gate: # gate coordinates (in m)
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    # values
    x:  4 # forward is positive x
    y:  0 # left is positive y
    z:  1.5
    drop: 0.4 # initial drop depth
    t_drop: 0.25 # initial drop duration

  slalom: # slalom coordinates
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    # depth
    z: 0.5
    # start
    x1: 2
    y1: 0  
    # middle
    x2: 2.5
    y2: -1
    # end
    x3: 3
    y3: 1

  return: # these should be in between oct and gate, and should avoid slalom, and cause some left/right motion
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 1 # m up/down buffer for all objects
    # midpoint 1
    x1: 3
    y1: 0
    # midpoint 2
    x2: 2
    y2: 0.5
    # depth
    drop: 0.3 # initial drop depth
    t_drop: 0.25 # initial drop duration
    depth: 0.7 # swimming depth

  torpedo: # approximate torpedo board position
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    # approach position (guestimate coordinates in front of the board)
    x1: 5
    y1: 0
    z: 0.7 # swimming depth in front of board
    # helper variables
    timeout: 8 # seconds to wait before giving up on a state
    t_loop: 0.1 # seconds to wait between vision checks in a loop
    distance_mode: medium # close=0.25m, medium=0.30m (~1ft), far=0.46m (~1.5ft, extra points)
    x_lineup_tolerance: 0.05 # meters, metric alignment error allowed when centered
    y_lineup_tolerance: 0.05 # meters
    min_radius: 0 # optional minimum hole radius before firing, 0 = off
    final_settle_time: 0.75 # s, station-keep hold before the final pre-fire verify pass
    # camera FOV and model weights live in config/hardware.yaml

  octagon: # octagon coordinates
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    x: 4
    y: 0
    z: -0.3 # set to < 0 to rise consistently (consider buffers)
    pause: 5 # seconds to pause at surface
    depth: 0.7 # swimming depth during oct mode
    angle: -45 # angle to look at target

  return: # these should be in between oct and gate, and should avoid slalom, and cause some left/right motion
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 1 # m up/down buffer for all objects
    # midpoint 1
    x1: 3
    y1: 0
    # midpoint 2
    x2: 2
    y2: 0.5
    # depth
    drop: 0.3 # initial drop depth
    t_drop: 0.25 # initial drop duration
    depth: 0.7 # swimming depth

lane_D: # ------------------------------------------------------------------------------------------------------
  # lane D from robosub finals 2025
  gate: # gate coordinates (in m)
    # buffers
    x_buf: 10 # m forward buffer for all objects
    y_buf: 10 # m left/right buffer for all objects
    z_buf: 0.6 # m up/down buffer for all objects
    # values
    x:  3.572 # forward is positive x
    y:  -0.7 # left is positive y
    z:  1.6
    drop: 0.2 # initial drop depth
    t_drop: 0.3 # initial drop duration

  slalom: # slalom coordinates
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.6 # m up/down buffer for all objects
    # start
    x1: 6.51
    y1: 0.392
    # middle
    x2: 8.45
    y2: 0.544
    # end
    x3: 10.506
    y3: 0.849
    # depth
    z:  1.6

  octagon: # octagon coordinates
    # buffers
    x_buf: 0.5 # m forward buffer for all objects
    y_buf: 0.5 # m left/right buffer for all objects
    z_buf: 0.6 # m up/down buffer for all objects
    # values
    x: 18.65
    y:  1.663
    z: -0.3 # set to < 0 to rise most consistently (consider buffers)
    pause: 0 # seconds to pause at surface
    depth: 1.6 # swimming depth during oct mode and return mode
    angle: -45 # angle to look at target

  return:
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.5 # m up/down buffer for all objects
    # midpoint 1
    x1: 10.51
    y1: -1
    # midpoint 2
    x2: 8.45
    y2: -1.5
    # depth
    drop: 1 # initial drop depth
    t_drop: 0.3 # initial drop duration
    depth: 1.6

  grabber: # octagon grabber task - same key set as the test course, lane_D coordinates
    x_buf: 0.5
    y_buf: 0.5
    z_buf: 0.6
    # FIXME: x1/y1 reuse the octagon surfacing point - measure the actual table position
    x1: 18.65
    y1: 1.663
    z: 1.6 # working depth in the octagon
    # ITEMS / BINS (class ids, 2026 15-class weights) -----------------------------------------
    # items on the center table and which basket marker each belongs to:
    # 5 electric / 6 nutbolt -> 13 warning, 4 bandaid / 7 pill -> 8 redcross
    item_class_ids: [5, 6, 4, 7]
    item_order: [5, 6, 4, 7] # grab preference - bin-13 items first to cut travel
    item_to_bin: {5: 13, 6: 13, 4: 8, 7: 8}
    # FIXME: basket coordinates/face yaws are guesses off the octagon center - measure on-site
    basket_a: {bin_id: 13, x: 19.5, y: 2.5, face_yaw: 0}
    basket_b: {bin_id: 8, x: 17.8, y: 0.8, face_yaw: 180}
    timeout: 8
    t_loop: 0.1
    desired_height: 0.3
    # FIXME: measure real table/basket depths on-site
    item_target_depth: 1.0
    basket_target_depth: 1.0
    x_lineup_tolerance: 0.05
    y_lineup_tolerance: 0.05
    max_object_yaml_error: 1.0
    final_settle_time: 0.75
    # GRAB VERIFY / SURFACING / PLACEMENT ------------------------------------------------------
    grab_retries: 2 # extra grab attempts per item after a failed lift-and-look
    grab_verify_height: 0.6 # m above the table to hover for the lift-and-look check
    grab_verify_time: 2.5 # s of clean (item-free) frames before a grab counts as verified
    verify_extend: 1.5 # s added once when lift-verify sightings are intermittent
    surface_z: 0.0 # target_z when surfacing with each item (and for the finale)
    surface_pause: 1.0 # s to hold at the surface with the item (scored)
    place_side: left # which side of the bin marker the FIRST item lands on (second goes opposite)
    place_margin: 0.10 # m past the marker's half-width for the placement offset
    place_margin_max: 0.25 # m clamp so a huge detection can't push the drop out of the basket
    post_release_check: true # 2s look-down after release; failure marks the count UNSURE
    post_release_time: 2.0 # s to look for the released item before marking UNSURE
    # STABILITY CONTRACT: a detection only counts after stable_frames consecutive frames
    # at stable_iou positional overlap - gates targeting, carry monitor, and grab verify
    stable_frames: 4
    stable_iou: 0.60
    class_swap_wait: 0.2 # s settle after swapping the YOLO classes filter (first inference lags)
    # FALLBACK KNOBS ---------------------------------------------------------------------------
    carry_max_width: 0.35 # normalized width gate - bigger detections = the item in our own claw
    carry_ignore_region: null # optional [x0, y0, x1, y1] normalized region where the claw dangles into frame
    search_lift: 0.4 # m to rise once (wider FOV) when an item search times out
    search_cycles: 2 # verify/align re-search cycles before skipping the item
    allow_wrong_bin: true # widen to both bin markers when the correct one isn't found (any bin scores)
    blind_release: true # dead-reckoned release when no marker is found at all (marks UNSURE)
    task_time_budget: 600 # s for the whole task before abandoning items and going finale
    dvl_grace: 5 # s of invalid DVL before hold-then-finale
    max_depth_limit: 3.0 # hard target_z clamp (never dive deeper than the course allows)
    # FINALE -----------------------------------------------------------------------------------
    finale_order: icon_first # icon_first (spins are the very last thing) | spin_first
    finale_turn_degrees: 360 # set 180 if that's the ruling on what counts as a rotation
    finale_assume_items: 2 # the "default to 2 when unsure" rule for spins + icon choice
    icon_scan_step: 15 # degrees per scan step while hunting the icon at the surface
    icon_timeout: 20 # s before falling back to heading-based icon facing
    icon_deg_per_image: 90 # forward camera horizontal FOV (proportional yaw gain)
    icon_yaw_sign: 1 # flip to -1 if the sub turns AWAY from icons during the scan
    rotation_step_timeout: 6 # s before a stuck quarter-turn step is force-advanced

test: # ------------------------------------------------------------------------------------------------------
  # for testing purposes only (never actually runs, pass fsm constructors [] for 2nd arg in launch.py)
  gate: # gate coordinates (in m)
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # values
    x:  1 # forward is positive x
    y:  0 # left is positive y
    z:  0
    drop: 0 # initial drop depth
    t_drop: 0.25 # initial drop duration

  slalom: # slalom coordinates
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # start
    x1: 2
    y1: 0
    # middle
    x2: 3
    y2: 0
    # end
    x3: 4
    y3: 0
    # depth
    z:  0

  octagon: # octagon coordinates
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # values
    x: 5
    y: 0
    z: 0 # set to < 0 to rise consistently (consider buffers)
    pause: 0 # seconds to pause at surface
    depth: 0 # swimming depth during oct mode and return mode
    angle: 0 # angle to look at target
    
  return: # these should be in between oct and gate, and should avoid slalom, and cause some left/right motion
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # midpoint 1
    x1: 3
    y1: 0
    # midpoint 2
    x2: 2
    y2: 0
    # depth
    drop: 0 # initial drop depth
    t_drop: 0 # initial drop duration
    depth: 0 # swimming depth

  torpedo: # approximate torpedo board position
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # approach position (guestimate coordinates in front of the board)
    x1: 3
    y1: 0
    z: 0
    # helper variables
    timeout: 8 # seconds to wait before giving up on a state
    t_loop: 0.1 # seconds to wait between vision checks in a loop
    distance_mode: medium # close=0.25m, medium=0.30m (~1ft), far=0.46m (~1.5ft, extra points)
    x_lineup_tolerance: 0.05 # meters, metric alignment error allowed when centered
    y_lineup_tolerance: 0.05 # meters
    min_radius: 0 # optional minimum hole radius before firing, 0 = off
    final_settle_time: 0.75 # s, station-keep hold before the final pre-fire verify pass
    # camera FOV and model weights live in config/hardware.yaml

  dropper: # approximate dropper pipeline position
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # FIXME: x1/y1/z below are guestimate coordinates for the "test" course only.
    # jesse_pool/lane_D/prequal don't have a dropper section at all yet - add one
    # with real measured/estimated pipeline coordinates before running there.
    x1: 3
    y1: 0
    z: 0
    # helper variables
    timeout: 8 # seconds to wait before giving up on a state
    t_loop: 0.01 # seconds to wait between vision checks in a loop (was 0.1, lowered for fps testing)
    # FIXME: 0.3m is a guess, confirm this is the right hover height for the real marker/dropper mechanism
    desired_height: 0.3 # m to hover above a bin (downward camera) before dropping
    # FIXME: waiting on the route plan to know which bin height (12/14/19/22 in
    # options, see conversation) applies to which bin. This is one placeholder
    # value used for every bin until the route plan assigns real per-bin depths.
    target_depth: 1.0 # m, placeholder
    x_lineup_tolerance: 0.05 # m, metric back-projection error allowed when centered
    y_lineup_tolerance: 0.05 # m
    same_bin_radius: 0.5 # m, reject a candidate bin this close to an already-completed bin
    max_object_yaml_error: 1.0 # m, reject a vision bin-world estimate this far from x1/y1 above
    final_settle_time: 0.75 # s, station-keep hold before the final pre-drop verify pass
    # model_weights and dropper_offset_x/y live in config/hardware.yaml

  grabber: # approximate grabber octagon position
    # buffers
    x_buf: 0.2 # m forward buffer for all objects
    y_buf: 0.2 # m left/right buffer for all objects
    z_buf: 0.2 # m up/down buffer for all objects
    # approach position (guestimate coordinates in front of the center table)
    x1: 4
    y1: 0
    z: 0
    # ITEMS / BINS (class ids, 2026 15-class weights) -----------------------------------------
    # items on the center table and which basket marker each belongs to:
    # 5 electric / 6 nutbolt -> 13 warning, 4 bandaid / 7 pill -> 8 redcross
    item_class_ids: [5, 6, 4, 7]
    item_order: [5, 6, 4, 7] # grab preference - bin-13 items first to cut travel
    item_to_bin: {5: 13, 6: 13, 4: 8, 7: 8}
    # FIXME: basket coordinates are guestimates. Baskets sit on two opposite octagon
    # edges (not at the center table x1/y1 above) - measure real coordinates and the
    # yaw to face each one from (face_yaw keeps markers in the orientation the model
    # trained on - v_flip was barely trained).
    basket_a: {bin_id: 13, x: 4, y: 1.5, face_yaw: 0}
    basket_b: {bin_id: 8, x: 4, y: -1.5, face_yaw: 180}
    # helper variables
    timeout: 8 # seconds to wait before giving up on a state
    t_loop: 0.1 # seconds to wait between vision checks in a loop
    desired_height: 0.3 # m to hover above an item/basket (downward camera) before grabbing/releasing
    # FIXME: waiting on real measured depths for the table/baskets, placeholders for now
    item_target_depth: 1.0 # m, placeholder
    basket_target_depth: 1.0 # m, placeholder
    x_lineup_tolerance: 0.05 # m, metric back-projection error allowed when centered
    y_lineup_tolerance: 0.05 # m
    max_object_yaml_error: 1.0 # m, reject a vision item/basket-world estimate this far from x1/y1 or basket_x/y
    final_settle_time: 0.75 # s, station-keep hold before the final pre-grab/pre-release verify pass
    # GRAB VERIFY / SURFACING / PLACEMENT ------------------------------------------------------
    grab_retries: 2 # extra grab attempts per item after a failed lift-and-look
    grab_verify_height: 0.6 # m above the table to hover for the lift-and-look check
    grab_verify_time: 2.5 # s of clean (item-free) frames before a grab counts as verified
    verify_extend: 1.5 # s added once when lift-verify sightings are intermittent
    surface_z: 0.0 # target_z when surfacing with each item (and for the finale)
    surface_pause: 1.0 # s to hold at the surface with the item (scored)
    place_side: left # which side of the bin marker the FIRST item lands on (second goes opposite)
    place_margin: 0.10 # m past the marker's half-width for the placement offset
    place_margin_max: 0.25 # m clamp so a huge detection can't push the drop out of the basket
    post_release_check: true # 2s look-down after release; failure marks the count UNSURE
    post_release_time: 2.0 # s to look for the released item before marking UNSURE
    # STABILITY CONTRACT: a detection only counts after stable_frames consecutive frames
    # at stable_iou positional overlap - gates targeting, carry monitor, and grab verify
    stable_frames: 4
    stable_iou: 0.60
    class_swap_wait: 0.2 # s settle after swapping the YOLO classes filter (first inference lags)
    # FALLBACK KNOBS ---------------------------------------------------------------------------
    carry_max_width: 0.35 # normalized width gate - bigger detections = the item in our own claw
    carry_ignore_region: null # optional [x0, y0, x1, y1] normalized region where the claw dangles into frame
    search_lift: 0.4 # m to rise once (wider FOV) when an item search times out
    search_cycles: 2 # verify/align re-search cycles before skipping the item
    allow_wrong_bin: true # widen to both bin markers when the correct one isn't found (any bin scores)
    blind_release: true # dead-reckoned release when no marker is found at all (marks UNSURE)
    task_time_budget: 600 # s for the whole task before abandoning items and going finale
    dvl_grace: 5 # s of invalid DVL before hold-then-finale
    max_depth_limit: 3.0 # hard target_z clamp (never dive deeper than the course allows)
    # FINALE -----------------------------------------------------------------------------------
    finale_order: icon_first # icon_first (spins are the very last thing) | spin_first
    finale_turn_degrees: 360 # set 180 if that's the ruling on what counts as a rotation
    finale_assume_items: 2 # the "default to 2 when unsure" rule for spins + icon choice
    icon_scan_step: 15 # degrees per scan step while hunting the icon at the surface
    icon_timeout: 20 # s before falling back to heading-based icon facing
    icon_deg_per_image: 90 # forward camera horizontal FOV (proportional yaw gain)
    icon_yaw_sign: 1 # flip to -1 if the sub turns AWAY from icons during the scan
    rotation_step_timeout: 6 # s before a stuck quarter-turn step is force-advanced
    # model_weights, claw_offset_x/y, and camera_rotate_180 live in config/hardware.yaml

prequal: # ------------------------------------------------------------------------------------------------------
  # for prequalification run
  tgt: # tgt coordinates (in m)
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    # gap (how far away from target for each turning point)
    gap: 1
    # values
    x:  4 # forward is positive x
    y:  -0.5 # left is positive y
    depth:  0.7
    drop: 0.3 # initial drop depth
    t_drop: 0.25 # initial drop duration