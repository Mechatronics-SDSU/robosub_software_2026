course: prequal # course that the sub is running in
motor_factor: 0.1 # changes motor speed, ~0.1 for air, ~0.7 for water

jesse_pool: # ------------------------------------------------------------------------------------------------------
  # smaller coordinates for jesse's pool (~9.02m long, ~1.2m min depth, ~3m wide)
  gate: # gate coordinates (in m)
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    # values
    x:  1 # forward is positive x
    y:  0 # left is positive y
    z:  0.7
    drop: 0.3 # initial drop depth
    t_drop: 0.25 # initial drop duration

  slalom: # slalom coordinates
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 1 # m up/down buffer for all objects
    # depth
    z: 0.7
    # start
    x1: 2
    y1: 0  
    # middle
    x2: 2.5
    y2: -0.5 
    # end
    x3: 3
    y3: 0 

  octagon: # octagon coordinates
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 0.3 # m up/down buffer for all objects
    x: 4
    y: 0
    z: -0.3 # set to < 0 to rise consistently (consider buffers)
    pause: 5 # seconds to pause at surface
    depth: 0.7 # swimming depth during oct mode
    angle: -45 # angle to look at target

  return: # these should be in between oct and gate, and should avoid slalom, and cause some left/right motion
    # buffers
    x_buf: 0.3 # m forward buffer for all objects
    y_buf: 0.3 # m left/right buffer for all objects
    z_buf: 1 # m up/down buffer for all objects
    # midpoint 1
    x1: 3
    y1: 0
    # midpoint 2
    x2: 2
    y2: 0.5
    # depth
    drop: 0.3 # initial drop depth
    t_drop: 0.25 # initial drop duration
    depth: 0.7 # swimming depth


  dropper: # dropper/basket coordinates (in m)
    # buffers
    x_buf: 0 # m forward buffer for dropper target
    y_buf: 0 # m left/right buffer for dropper target
    z_buf: 0 # m up/down buffer for dropper target
    # values
    x: 0 # forward is positive x
    y: 0 # left is positive y
    travel_depth: 0 # depth while driving to the basket/bin
    drop_depth: 0 # depth used when dropping the ball/marker
    center_buf: 0 # normalized camera centering buffer
    min_confidence: 0 # minimum vision confidence for basket/bin detection
    stable_frames: 0 # centered frames required before dropping
    search_timeout: 0 # seconds before giving up search
    drop_motor_power: 0 # brushless motor power for release
    drop_spin_time: 0 # seconds to spin motor for one drop
    rearm_time: 0 # seconds to wait before another drop
    num_balls: 0 # number of balls/markers to drop

  grabber: # grabber/claw coordinates (in m)
    # buffers
    x_buf: 0 # m forward buffer for grabber target
    y_buf: 0 # m left/right buffer for grabber target
    z_buf: 0 # m up/down buffer for grabber target
    # values
    x: 0 # forward is positive x
    y: 0 # left is positive y
    travel_depth: 0 # depth while driving to the item/table
    grab_depth: 0 # depth used when closing claw around item
    carry_depth: 0 # depth used after lifting the item
    center_buf: 0 # normalized camera centering buffer
    min_confidence: 0 # minimum vision confidence for item detection
    stable_frames: 0 # centered frames required before grabbing
    search_timeout: 0 # seconds before giving up search
    open_time: 0 # seconds to wait after opening claw
    close_time: 0 # seconds to wait after closing claw
    verify_timeout: 0 # seconds to wait for pickup verification
    hold_after_pickup: 0 # keep holding item after pickup


lane_D: # ------------------------------------------------------------------------------------------------------
  # lane D from robosub finals 2025
  gate: # gate coordinates (in m)
    # buffers
    x_buf: 10 # m forward buffer for all objects
    y_buf: 10 # m left/right buffer for all objects
    z_buf: 0.6 # m up/down buffer for all objects
