# Hardware/deployment config — edit this file to match the current physical setup.
# Mission waypoints, tolerances, and course selection live in objects.yaml instead.
# Changing which camera the sub uses means editing `camera.source` here, nothing else.

#      (front)
#  ⌜     +x     ⌝
#
#
#  +y        -y z=0 (up) z+ (down)
#
#
#  ⌞     -x     ⌟

# FIXME: The coordinates below do not fulfil the sub's standard, additionally, downcamera is flipped so it would invert signs for x and y

camera:
  source: zed       # zed | downfacing | webcam
  camera_id: 0      # GMSL/multi-camera index for ZED X-series GMSL boxes (0–3); ignored for USB ZED
  resolution: VGA   # ZED capture resolution: VGA | HD720 | HD1080 | HD2K (HD1200/SVGA/WVGA for ZED X-series only)
  fps: 60           # ZED capture frame rate
  fov_x_deg: 90     # camera horizontal field of view in degrees, used by torpedo alignment math
  fov_y_deg: 60     # camera vertical field of view in degrees

# Per-task hardware offsets and model weights.
# Offsets are in the sub's body frame (x = forward, y = left), measured level.

torpedo:
  model_weights: models/best.pt
  # FIXME: tube_offset_x/y are unmeasured. Tape-measure, sub level:
  # forward/aft (x) and left/right (y) distance between the forward ZED camera's
  # optical center and the torpedo tube exit point. 0.0 = no correction.
  tube_offset_x: 0.0
  tube_offset_y: 0.0

dropper:
  model_weights: models/best.pt
  # offset_x/y (body frame, meters): camera optical center -> dropper release point.
  # Team measurement 7/14: center-aligned forward, 0.047725 m lateral.
  # (Previous tape-measure had 0.0889/0.0254 - re-measure if the mount moves.)
  offset_x: 0.0
  offset_y: 0.047725

grabber:
  model_weights: models/best.pt
  # FIXME: claw_offset_x/y (body frame, meters) — separate tape-measure from dropper above.
  claw_offset_x: 0.0
  claw_offset_y: 0.0
  # true if the downfacing camera got remounted upside down (180° about its optical axis) -
  # rotates the raw frame + mirrors the principal point so calibration stays exact
  camera_rotate_180: false
