## Training Config — Mechatronics Vision 2026
  # Single source of truth for all training-time settings.
  # Loaded by: train.ipynb, augmentation_pipeline.ipynb
  # For runtime/deployment settings see config.yaml (separate concern)

## Data
data:
  images:     data/images
  poly_labels: data/labels
  bbox_labels: data/labels_bbox
  yolo_dataset: yolo_dataset

## Runs
# All training output lands here (weights, metrics, plots)
runs_dir: models

## Label Kind
# polygon : instance segmentation — reads poly_labels, uses *-seg.pt base
# bbox    : detection only        — reads bbox_labels, uses *.pt base
label_kind: polygon

## Base YOLO Model
# Resolved automatically from label_kind; override here if needed
# polygon: yolo11m-seg.pt  (~20M params, COCO instance-seg pretrained)
# bbox:    yolo11m.pt
ft_model:
  polygon: yolo11m-seg.pt
  bbox:    yolo11m.pt

## Classes
# Matches CLASS_NAMES in main.py — keep in sync
classes:
  0: firetruck
  1: fire
  2: ambulance
  3: blood

## Training Hyperparameters
training:
  image_size:   720
  val_fraction: 0.20
  seed:         1337
  ft_epochs:    300    # ceiling — patience early-stops before this if mAP plateaus
  ft_patience:  50     # stop if val mAP doesn't improve for N epochs
  ft_batch:     8
  deep_run_name: deep_ft  # run folder under runs_dir

## Section B — Supervised Contrastive (optional)
supcon:
  epochs:   30
  batch:    16
  temp:     0.1
  proj_dim: 128

## Section C — DINO self-supervised (gated)
dino:
  gate_min_unlabeled: 500   # skip if fewer than this many raw frames exist
  epochs:      50
  batch:       32
  temp_student: 0.1
  temp_teacher: 0.04
  ema:          0.996

## Augmentation Probabilities
# Each key maps to an independent Bernoulli draw — fires independently per sample
augmentation:
  probs:
    h_flip:          0.5
    v_flip:          0.1
    rotate_90:       0.3
    rotate_small:    0.5
    affine_skew:     0.3
    random_crop:     0.5
    color_jitter:    0.5
    color_gradient:  0.5   # smooth spatial RGB tint (some regions warmer/cooler)
    hue_rotate:      0.3   # full hue rotation chance (reds -> blue, etc.)
    channel_dropout: 0.10
    cutout:          0.5
    gauss_noise:     0.3
    gauss_blur:      0.3
    sobel:           0.08

  crop_scale:    [0.6, 1.0]
  rotate_deg:    20
  skew_deg:      10
  cutout_holes:  [1, 4]
  cutout_frac:   [0.05, 0.12]

  # Color shift tuning
  color_gradient_max_shift: 30   # +/- per-pixel 8-bit RGB offset, smoothly interpolated
  color_gradient_grid:      4    # control-point grid size (larger = higher-frequency tint)
  hue_rotate_limit:         90   # OpenCV H units (0-179 scale). 90 = up to full half-rotation
