
<!DOCTYPE html>
<html>
    <head>
        <style> 
                body{
                        margin-top: 30px;
                        margin-left: 30px;
                }
                body.pink{
                        background-color: rgb(255, 229, 240);
                }     
                body.dark{
                        background-color: rgb(28,28,28);
                }  
                .buttons{
                        padding: 15px;
                        border-radius: 5px;
                        text-decoration: none;
                        font-weight: bold;
                        display: inline-block;
                        margin-top: 10px;
                        margin-left: 30px;
                        margin-bottom: 10px;
                        font-size: 20px;
                }
                .buttons.pink{
                        color: rgb(255, 177, 188);
                        background-color: rgb(255, 255, 255);
                }
                .buttons.dark{
                        color: rgb(255,255,255);
                        background-color: rgb(0,0,0);
                        outline: 1px solid rgb(255,255,255);
                }
                .title{
                        outline: 0px;
                        background-color: transparent;
                        font-size: 50px;
                        margin-top: 10px;
                        margin-bottom: 50px;
                        margin-left: 30px;
                }
                .title.pink{
                        color: rgb(255, 177, 188);
                }
                .title.dark{
                        color: rgb(255, 255, 255);
                }
                .toggle {
                        position: relative;
                        display: inline-block;
                        width: 60px;
                        height: 34px;
                }
                .slider {
                        position: absolute;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        background-color: #333;
                        border-radius: 34px;
                }
                .slider:before {
                        position: absolute;
                        content: "";
                        height: 26px;
                        width: 26px;
                        left: 4px;
                        bottom: 4px;
                        background-color: #FFF;
                        border-radius: 50%;
                }
                input:checked + .slider {
                        background-color: rgb(255, 177, 188);
                }
                input:checked + .slider:before {
                        transform: translateX(26px);
                }
        </style>
    </head>
    <body class="{{ color_mode }}">

        <label class="toggle">
        <input type="checkbox" id="btnToggle" name="btnToggle" onchange="color_switch()"
        {% if color_mode == "dark" %}checked{% endif %} />
        <span class="slider"></span>
        </label>


       <a  href = "{% url 'index' %}"
            class=  "{{ color_mode }} buttons"
            style=  "border-radius: 50px;"  
            >
                    Return to Homepage
        </a>

        <h1 class="{{ color_mode }} title"
        >
            Mission Planner
        </h1>

        <a  href = "{% url 'edit_mode_list' %}"
            class="{{ color_mode }} buttons"
        >
            Edit Mode List
        </a>

        <a  href = "{% url 'edit_courses' %}"
            class="{{ color_mode }} buttons"
        >
            Edit Courses
        </a>

        <script>
                function color_switch(){
                        fetch(`{% url 'change_color_mode' %}`)
                                .then(() => location.reload());
                }
        </script>
    </body>
</html>
