<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Courses</title>

    <style>
        body{
                margin-top: 30px;
                margin-left: 30px;
        }
        body.pink{
                background-color: rgb(255, 229, 240);
        }     
        body.dark{
                background-color: rgb(28,28,28);
        }  

        .title {
            color: #f6b1bc;
            font-size: 48px;
            margin-bottom: 20px;
        }
        .title.pink{
                        color: rgb(255, 177, 188);
        }
        .title.dark{
                        color: rgb(255, 255, 255);
        }

        .buttons{
                        padding: 15px;
                        border-radius: 5px;
                        text-decoration: none;
                        font-weight: bold;
                        display: inline-block;
                        margin-top: 10px;
                        margin-left: 30px;
                        margin-bottom: 10px;
                        font-size: 20px;
        }
         .buttons.pink{
                        color: rgb(255, 177, 188);
                        background-color: rgb(255, 255, 255);
        }
        .buttons.dark{
                        color: rgb(255,255,255);
                        background-color: rgb(0,0,0);
                        outline: 1px solid rgb(255,255,255);
        }
        .text{
                        width:600px;
                        height:250px;
        }
        .text.pink{
                    color:rgb(146, 44, 58);
        }
        .text.dark{
                    color: rgb(255,255,255);
        }
        table {
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #fff0f6;
        }

        input {
            width: 80px;
            padding: 5px;
        }

        table{
            border-collapse: collapse;
            margin-top: 20px;
            margin-left: 30px;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        th.pink, td.pink{
            color: rgb(249, 121, 138);
            border: 1px solid #aaa;
        }
        th.dark, td.dark{
            color: rgb(255,255,255);
            border: 1px solid #ffffff;
        }
        th.pink{
            background-color: #fff0f6;
        }
        th.dark {
            background-color: #2f2f2f;
        }

        input {
            width: 80px;
            padding: 5px;
        }

        .toggle {
                        position: relative;
                        display: inline-block;
                        width: 60px;
                        height: 34px;
                }
                .slider {
                        position: absolute;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        background-color: #333;
                        border-radius: 34px;
                }
                .slider:before {
                        position: absolute;
                        content: "";
                        height: 26px;
                        width: 26px;
                        left: 4px;
                        bottom: 4px;
                        background-color: #FFF;
                        border-radius: 50%;
                }
                input:checked + .slider {
                        background-color: rgb(255, 177, 188);
                }
                input:checked + .slider:before {
                        transform: translateX(26px);
                }

    </style>
</head>

<body class="{{ color_mode }}">

    <label class="toggle">
        <input type="checkbox" id="btnToggle" name="btnToggle" onchange="color_switch()"
        {% if color_mode == "dark" %}checked{% endif %} />
        <span class="slider"></span>
        </label>

        <a  href = "{% url 'index' %}"
            class=  "{{ color_mode }} buttons"
            style=  "border-radius: 50px;"  
            >
                    Return to Homepage
        </a>

        <h2 class="{{ color_mode }} title">Edit Courses</h2>
    
    <div style="margin-bottom: 10px;">

    <h1 class="{{ color_mode }} text"
        style="font-size: 20px;
               height:20px;
               margin-bottom: 5px;
               margin-top: 20px;">
                Create copy of yaml file
    </h1>

    <label class="{{ color_mode }} text" for="title">File Title</label>

    <input type="text" id="title">

    <button onClick="copy()"
            style="margin-bottom: 20px;">Create:</button>
    
    </div>

    <a  href = "{% url 'reset_courses' %}"
            class=  "{{ color_mode }} buttons"
            style=  "margin-top: -40; margin-bottom: 30px;"  
            >
                    Reset to Default
        </a>

        <a  href = "{% url 'make_default' %}"
            class=  "{{ color_mode }} buttons"
            style=  "margin-top: -40; margin-bottom: 30px;"  
            >
                    Make Default
        </a>
        <div    style="margin-bottom: 10px; margin-top: 10px;">
    
            <button 
                class="{{ color_mode }} buttons"
                style="margin: 5px 0;
                        margin-left: 30px;
                        font-size: 20px;
                        padding: 5px 5px;"
                onClick="update()"
            >   Update
            </button>
    
    </div>
    </div>
    <br>

    <table style="margin-bottom: 20px;">
        <tr>
            <th class="{{ color_mode }}">motor factor</th>
        </tr>
        <tr>
            <td class="{{ color_mode }}">
                <input type="text" id="motor" value="{{ motor }}">
            </td>
        </tr>
    </table>

    <label class="{{ color_mode }} text" for="course">Switch Course:</label>
    
    <select id="course" name="course" onchange="re()">
        {% for c in courses %}
        <option value="{{ c }}" {% if course == c %}selected{% endif %}>
            {{ c|title }}
        </option>
        {% endfor %}
    </select>

    {% for obj in objects %}
<table style="margin-bottom: 100px;">
    <tr>
        <th class="{{ color_mode }}">{{ obj.mode|upper }}</th>
       {% for key, value in obj.val %}
            <th class="{{ color_mode }}">{{ key }}</th>
        {% endfor %}
    </tr>

    <tr>
        <th class="{{ color_mode }}">value</th>
        {% for key, value in obj.val %}
            <td class="{{ color_mode }}">
                <input
                    type="text"
                    class="course-input"
                    data-mode="{{ obj.mode }}"
                    data-key="{{ key }}"
                    value="{{ value }}"
                >
            </td>
        {% endfor %}
    </tr>
</table>
{% endfor %}
  

    <pre id="output" class="{{ color_mode }} text"></pre>

    <script>

        function color_switch(){
                        fetch(`{% url 'change_color_mode' %}`)
                                .then(() => location.reload());
        }

        async function re(){
            c = document.getElementById("course").value;
            await fetch(`{% url 'set_course' %}?course=${encodeURIComponent(c)}`);
            location.reload();
        }

        function copy(){
            fetch(`{% url 'copy_yaml' %}?title=${encodeURIComponent(document.getElementById("title").value)}`);
        }

        async function enter(mode, key, val){
            let course = document.getElementById("course").value;
            await fetch(`{% url 'set_objects_yaml_value' %}?mode=${encodeURIComponent(mode)}&course=${encodeURIComponent(course)}&val=${encodeURIComponent(val)}&key=${encodeURIComponent(key)}`);
        }

        async function update(){
            await fetch(`{% url 'set_motor' %}?motor=${encodeURIComponent(document.getElementById("motor").value)}`);
        
            const inputs = document.querySelectorAll(".course-input");

            for (let input of inputs) {
            const mode = input.dataset.mode;
            const key = input.dataset.key;
            const val = input.value;
            await enter(mode, key, val);
    }
        }


    </script>
    </body>
</html>
