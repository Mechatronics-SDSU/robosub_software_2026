<!DOCTYPE html>
<html>

    <head>
            <script src="https://cdn.plot.ly/plotly-3.2.0.min.js" charset="utf-8"></script>
                
            <style>
                body{
                        margin-top: 30px;
                        margin-left: 30px;
                }
                body.pink{
                        background-color: rgb(255, 229, 240);
                }     
                body.dark{
                        background-color: rgb(28,28,28);
                }  
                .container{
                    display: flex;
                    gap: 20px;
                    align-items: flex-start;
                    width: 180px;
                }
                .blockR{
                    margin-top: 150px;
                    margin-left: 100px;
                }
                .buttons{
                        padding: 15px;
                        border-radius: 5px;
                        text-decoration: none;
                        font-weight: bold;
                        display: inline-block;
                        margin-top: 10px;
                        margin-left: 30px;
                        margin-bottom: 20px;
                        font-size: 20px;
                }
                .buttons.pink{
                        color: rgb(255, 177, 188);
                        border: none;
                        background-color: rgb(255, 255, 255);
                        outline: 1px solid rgb(255,177,188);
                }
                .buttons.dark{
                        color: rgb(255,255,255);
                        background-color: rgb(0,0,0);
                        outline: 1px solid rgb(255,255,255);
                }
                .title{
                        outline: 0px;
                        background-color: transparent;
                        font-size: 50px;
                        margin-top: 10px;
                        margin-bottom: 10px;
                        margin-left: 30px;
                }
                .title.pink{
                        color: rgb(255, 177, 188);
                }
                .title.dark{
                        color: rgb(255, 255, 255);
                }
                .text{
                        width:600px;
                        height:250px;
                        font-size: x-large;
                }
                .text.pink{
                    color:black;
                }
                .text.dark{
                    color: rgb(255,255,255);
                }
                

                .toggle {
                        position: relative;
                        display: inline-block;
                        width: 60px;
                        height: 34px;
                }
                .slider {
                        position: absolute;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        background-color: #333;
                        border-radius: 34px;
                }
                .slider:before {
                        position: absolute;
                        content: "";
                        height: 26px;
                        width: 26px;
                        left: 4px;
                        bottom: 4px;
                        background-color: #FFF;
                        border-radius: 50%;
                }
                input:checked + .slider {
                        background-color: rgb(255, 177, 188);
                }
                input:checked + .slider:before {
                        transform: translateX(26px);
                }
            </style>
    </head>

    <body class="{{ color_mode }}">
        
        <label class="toggle">
        <input type="checkbox" id="btnToggle" name="btnToggle" onchange="color_switch()"
        {% if color_mode == "dark" %}checked{% endif %} />
        <span class="slider"></span>
        </label>

        <a  href = "{% url 'index' %}"
            class=  "{{ color_mode }} buttons"
            style=  "border-radius: 50px;"  
            >
                    Return to Homepage
        </a>

        <h2 class="{{ color_mode }} title">
            Telemetry Viewer
        </h2>

        <div class="container">
        <div>

        <button class="{{ color_mode }} buttons" id="dvl_reset_button">
                DVL RESET
        </button>

        <div id="dvlV" style="width:600px;height:250px;"></div>
        <div id="dvlYPR" style="width:600px;height:250px;"></div>
        <div id="dvlPos" style="width:600px;height:250px;"></div>

        </div>


        <div class="blockR">

        <pre id="out"
             style="width:600px;height:250px;"
             class="{{ color_mode }} text">
        </pre>


        </div>
        </div>

        <script>
                function color_switch(){
                        fetch(`{% url 'change_color_mode' %}`)
                                .then(() => location.reload());
                }

                const reset_button = document.getElementById("dvl_reset_button");
                reset_button.addEventListener("click", DVLRESET);

                const out = document.getElementById('out');
                const DVLV = document.getElementById('dvlV');
                const DVLYPR = document.getElementById('dvlYPR');
                const DVLPos = document.getElementById('dvlPos');
                
                let plotReadyV = false; let plotReadyYPR = false; let plotReadyPos = false;

                var vx1ago = 0; var vx2ago = 0; var vx3ago = 0;
                var vy1ago = 0; var vy2ago = 0; var vy3ago = 0;
                var vz1ago = 0; var vz2ago = 0; var vz3ago = 0;
                var yaw1ago = 0; var yaw2ago = 0; var yaw3ago = 0;
                var pitch1ago = 0; var pitch2ago = 0; var pitch3ago = 0;
                var roll1ago = 0; var roll2ago = 0; var roll3ago = 0;
                var x1ago = 0; var x2ago = 0; var x3ago = 0;
                var y1ago = 0; var y2ago = 0; var y3ago = 0;
                var z1ago = 0; var z2ago = 0; var z3ago = 0;

                async function DVLRESET(){
                    await fetch("{% url 'DVLreset' %}");
                }

                async function tick(){

                    let r = await fetch("{% url 'get_telemetry' %}");

                    const j = await r.json();
                    out.textContent = JSON.stringify(j, null, 2)
                    const d = j.dvl;

                    const traceVX = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [vx3ago, vx2ago, vx1ago, d.vx],
                        type: 'scatter',
                        marker: {color: 'blue'},
                        name: 'X'
                    };
                    
                    const traceVY = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [vy3ago, vy2ago, vy1ago, d.vy],
                        type: 'scatter',
                        marker: {color: 'red'},
                        name: 'Y'
                    };
                    
                    const traceVZ = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [vz3ago, vz2ago, vz1ago, d.vz],
                        type: 'scatter',
                        marker: {color: 'black'},
                        name: 'Z'
                    };

                    const traceYaw = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [yaw1ago, yaw2ago, yaw1ago, d.yaw],
                        type: 'scatter',
                        marker: {color: 'black'},
                        name: 'Yaw'
                    };

                    const tracePitch = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [pitch1ago, pitch2ago, pitch1ago, d.pitch],
                        type: 'scatter',
                        marker: {color: 'blue'},
                        name: 'Pitch'
                    };

                    const traceRoll = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [roll1ago, roll2ago, roll1ago, d.roll],
                        type: 'scatter',
                        marker: {color: 'red'},
                        name: 'Roll'
                    };

                    const traceX = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [x1ago, x2ago, x1ago, d.x],
                        type: 'scatter',
                        marker: {color: 'red'},
                        name: 'X'
                    };

                    const traceY = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [y1ago, y2ago, y1ago, d.y],
                        type: 'scatter',
                        marker: {color: 'blue'},
                        name: 'Y'
                    };

                    const traceZ = {
                        x: ['3ago', '2ago', '1ago', 'now'],
                        y: [z1ago, z2ago, z1ago, d.z],
                        type: 'scatter',
                        marker: {color: 'black'},
                        name: 'Z'
                    };

                    roll3ago = roll2ago; roll2ago = roll1ago; roll1ago = d.roll;
                    pitch3ago = pitch2ago; pitch2ago = pitch1ago; pitch1ago = d.pitch;
                    yaw3ago = yaw2ago; yaw2ago = yaw1ago; yaw1ago = d.yaw;
                    vx3ago = vx2ago; vx2ago = vx1ago; vx1ago = d.vx;
                    vy3ago = vy2ago; vy2ago = vy1ago; vy1ago = d.vy;
                    vz3ago = vz2ago; vz2ago = vz1ago; vz1ago = d.vz;
                    x3ago = x2ago; x2ago = x1ago; x1ago = d.x;
                    y3ago = y2ago; y2ago = y1ago; y1ago = d.y;
                    z3ago = z2ago; z2ago = z1ago; z1ago = d.z;

                    if (!plotReadyV) {
                            Plotly.newPlot(DVLV, [traceVX, traceVY, traceVZ], {
                                title: {
                                        text: 'Velocity',
                                        font: { size: 30, color: 'black'}},
                                xaxis: { showticklabels: false,},
                                margin: { t: 80 }
                            });
                        plotReadyV = true;
                    } else {
                            Plotly.react(DVLV, [traceVX, traceVY, traceVZ], DVLV.layout);
                    }  


                    if (!plotReadyYPR) {
                            Plotly.newPlot(DVLYPR, [traceYaw, tracePitch, traceRoll], {
                                title: {
                                        text: 'Rotation',
                                        font: {size: 30, color: 'black'}},
                                xaxis: {showticklabels: false,},
                                margin: { t: 50 }
                            });
                        plotReadyYPR = true;
                    } else {
                            Plotly.react(DVLYPR, [traceYaw, tracePitch, traceRoll], DVLYPR.layout);
                    }


                    if (!plotReadyPos) {
                            Plotly.newPlot(DVLPos, [traceX, traceY, traceZ], {
                                title: {
                                        text: 'Position',
                                        font: { size: 30, color: 'black'}},
                                xaxis: {showticklabels: false,},
                                margin: { t: 50 }
                            });
                        plotReadyPos = true;
                    } else {
                            Plotly.react(DVLPos, [traceX, traceY, traceZ], DVLPos.layout);
                    }
                }
                tick();
                setInterval(tick, 500);
        </script>

    </body>
</html>
